<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Placement Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Noto+Kufi+Arabic:wght@500;700&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("elp_theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme="light"}</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="shell">
  <aside id="side"></aside>
  <div class="main">
    <header class="top"><span id="crumb"></span><span class="tools"><span id="sync" class="sync"></span><span id="who"></span><button id="theme" class="icon-btn" type="button"></button></span></header>
    <main id="app"></main>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/storage.js"></script>
<script src="js/evaluator.js"></script>
<script src="js/voice.js"></script>
<script src="js/app.js"></script>
</body>
</html>
